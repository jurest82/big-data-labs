service: lab13-flink
frameworkVersion: '^4.43.0'
configValidationMode: error

provider:
  name: aws
  stage: dev
  region: us-east-1
  stackName: ${env:DEPLOY_APP}-${self:service}
  deploymentBucket:
    name: ${self:provider.region}.cfn.${self:service}.${env:DEPLOY_APP}.${aws:accountId}.deploys

plugins:
  - serverless-deployment-bucket
  - '@serverless/safeguards-plugin'

resources:
  - ${file(kinesis.yml)}
  - ${file(s3.yml)}
  - ${file(dynamodb.yml)}
  - ${file(iam.yml)}
  - ${file(flink.yml)}
  - ${file(parameters.yml)}

custom:
  safeguards:
    - safeguard: framework-version
      enforcementLevel: warning
      config: ${self:frameworkVersion}
    - safeguard: allowed-regions
      enforcementLevel: error
      config:
        - ${self:provider.region}
    - safeguard: no-wild-iam-role-statements
      enforcementLevel: warning
    - safeguard: allowed-stages
      enforcementLevel: error
      config:
        - dev
  servicePrefix: ${env:DEPLOY_APP}-${self:service}
  flink:
    streamName: ${env:DEPLOY_APP}-flink-orders
    applicationName: ${env:DEPLOY_APP}-orders-flink
    bucketName: ${env:DEPLOY_APP}-flink-${aws:accountId}
    tableName: ${env:DEPLOY_APP}-order-windows
    # create, or skip to deploy everything but the application
    application: ${param:application, 'create'}
