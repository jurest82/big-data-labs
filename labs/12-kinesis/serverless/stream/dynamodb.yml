Resources:
  OrderEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:custom.orders.tableName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: N
        - AttributeName: event_type
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
        - AttributeName: event_type
          KeyType: RANGE
